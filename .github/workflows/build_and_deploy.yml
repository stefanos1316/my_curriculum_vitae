name: Build and Deploy CV

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Set up Python 3.11
      uses: actions/setup-python@v1
      with:
        python-version: 3.11
    - name: Install dependencies 🔧
      run: |
        sudo apt-get install texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-context pandoc context
        pip install "notebook==4.2" requests jupyter_cms jupyter_dashboards
    - name: Build new content 🛎️
      run: |
        make
    - name: Prepare site assets
      run: |
        cp certificates/* degrees/* proofs/* publications/*/* achievements/* img/* web/
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true
        token: ${{ secrets.TOKEN }}
    - name: Deploy to GitHub Pages 🚀
      id: deployment
      uses: actions/deploy-pages@v5
